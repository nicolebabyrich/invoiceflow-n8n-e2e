services:
  n8n:
    build: .
    image: n8n-invoiceflow:2.4.6
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - NODE_FUNCTION_ALLOW_EXTERNAL=exceljs,xlsx
      - NODE_FUNCTION_ALLOW_BUILTIN=crypto,fs
      - N8N_RESTRICT_FILE_ACCESS_TO=/files/finance;/home/node/.n8n-files
      - GENERIC_TIMEZONE=Asia/Ho_Chi_Minh
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - n8n_data:/home/node/.n8n
      - ../finance_share:/files/finance

volumes:
  n8n_data:
    external: true
